[project]
name = "thumbv"
version = "0.1.0"
description = "Thumb-V golden model: Thumb to RV32 expander, executor and lockstep harness"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "unicorn>=2.0",
    "capstone>=5.0",
    "pyelftools>=0.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model/thumbv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
